<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>C Assistant</title>
  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
  <style>
    /* ── Reset & base ───────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #1a1a2e;
      --surface:   #16213e;
      --surface2:  #0f3460;
      --accent:    #a0c4ff;
      --accent2:   #7eb8f7;
      --text:      #dcdcdc;
      --text-dim:  #8888aa;
      --border:    #2a2a4a;
      --btn-bg:    #252541;
      --btn-hov:   #37375f;
      --green:     #6bcb77;
      --red:       #ff6b6b;
      --radius:    10px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ─────────────────────────────────────────────── */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 14px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo {
      width: 36px; height: 36px;
      background: var(--btn-bg);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; font-weight: 800;
      color: var(--accent);
      border: 2px solid var(--accent);
      flex-shrink: 0;
    }

    header h1 {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--accent);
    }

    header p {
      font-size: 0.78rem;
      color: var(--text-dim);
      margin-left: auto;
    }

    /* ── API key bar ─────────────────────────────────────────── */
    .key-bar {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 10px 24px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .key-bar label {
      font-size: 0.8rem;
      color: var(--text-dim);
      white-space: nowrap;
    }

    .key-bar input {
      flex: 1;
      background: var(--btn-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 6px 10px;
      color: var(--text);
      font-size: 0.82rem;
      font-family: monospace;
      outline: none;
      max-width: 520px;
    }

    .key-bar input:focus { border-color: var(--accent); }

    .key-status {
      font-size: 0.75rem;
      padding: 4px 10px;
      border-radius: 20px;
    }
    .key-status.ok  { background: #1a3a1a; color: var(--green); }
    .key-status.bad { background: #3a1a1a; color: var(--red); }

    /* ── Main layout ─────────────────────────────────────────── */
    main {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0;
      overflow: hidden;
      height: calc(100vh - 105px);
    }

    @media (max-width: 768px) {
      main { grid-template-columns: 1fr; height: auto; }
    }

    /* ── Panel shared ────────────────────────────────────────── */
    .panel {
      display: flex;
      flex-direction: column;
      border-right: 1px solid var(--border);
      overflow: hidden;
    }

    .panel:last-child { border-right: none; }

    .panel-header {
      padding: 12px 18px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text-dim);
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    /* ── Input panel ─────────────────────────────────────────── */
    textarea {
      flex: 1;
      background: var(--bg);
      border: none;
      resize: none;
      padding: 16px;
      color: var(--text);
      font-family: 'Cascadia Code', 'Consolas', monospace;
      font-size: 0.9rem;
      line-height: 1.6;
      outline: none;
    }

    textarea::placeholder { color: var(--text-dim); }

    .btn-row {
      padding: 12px 16px;
      display: flex;
      gap: 8px;
      background: var(--surface);
      border-top: 1px solid var(--border);
      flex-wrap: wrap;
    }

    .btn {
      flex: 1;
      min-width: 80px;
      padding: 9px 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--btn-bg);
      color: var(--text);
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, transform 0.1s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
    }

    .btn:hover  { background: var(--btn-hov); border-color: var(--accent); }
    .btn:active { transform: scale(0.97); }

    .btn.primary {
      background: var(--surface2);
      border-color: var(--accent);
      color: var(--accent);
    }

    .btn.primary:hover { background: #1a4a80; }

    .btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none;
    }

    /* ── Output panel ────────────────────────────────────────── */
    .output-area {
      flex: 1;
      overflow-y: auto;
      padding: 18px;
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
    }

    .placeholder-msg {
      color: var(--text-dim);
      font-size: 0.88rem;
      line-height: 1.7;
      text-align: center;
      margin-top: 60px;
    }

    .placeholder-msg .big { font-size: 2.5rem; margin-bottom: 12px; }

    /* ── Mode badge ──────────────────────────────────────────── */
    .mode-badge {
      display: inline-block;
      padding: 2px 10px;
      border-radius: 20px;
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 14px;
    }

    .badge-explain  { background: #1a3a2a; color: #6bcb77; }
    .badge-hint     { background: #2a2a1a; color: #ffd166; }
    .badge-fix      { background: #3a1a1a; color: #ff6b6b; }
    .badge-solution { background: #1a2a3a; color: var(--accent); }

    /* ── Markdown rendered output ────────────────────────────── */
    .md-output h1, .md-output h2, .md-output h3 {
      color: var(--accent);
      margin: 18px 0 8px;
    }

    .md-output h1 { font-size: 1.2rem; }
    .md-output h2 { font-size: 1.05rem; }
    .md-output h3 { font-size: 0.95rem; }

    .md-output p  { margin: 8px 0; line-height: 1.7; }
    .md-output ul, .md-output ol { margin: 8px 0 8px 22px; line-height: 1.7; }
    .md-output li { margin: 3px 0; }

    .md-output pre {
      background: #0d1117;
      border: 1px solid var(--border);
      border-radius: 8px;
      margin: 12px 0;
      overflow-x: auto;
    }

    .md-output pre code {
      font-family: 'Cascadia Code', 'Consolas', monospace;
      font-size: 0.82rem;
      line-height: 1.55;
    }

    .md-output code:not(pre code) {
      background: var(--btn-bg);
      padding: 1px 5px;
      border-radius: 4px;
      font-family: 'Cascadia Code', 'Consolas', monospace;
      font-size: 0.85em;
      color: var(--accent);
    }

    .md-output table {
      border-collapse: collapse;
      width: 100%;
      margin: 12px 0;
      font-size: 0.85rem;
    }

    .md-output th, .md-output td {
      border: 1px solid var(--border);
      padding: 7px 12px;
      text-align: left;
    }

    .md-output th { background: var(--surface); color: var(--accent); }
    .md-output tr:nth-child(even) { background: #ffffff08; }

    .md-output blockquote {
      border-left: 3px solid var(--accent);
      padding-left: 14px;
      color: var(--text-dim);
      margin: 10px 0;
    }

    /* ── Spinner ─────────────────────────────────────────────── */
    .spinner {
      display: inline-block;
      width: 18px; height: 18px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .thinking {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--text-dim);
      font-size: 0.88rem;
      margin-top: 40px;
      justify-content: center;
    }

    /* ── Error box ───────────────────────────────────────────── */
    .error-box {
      background: #3a1a1a;
      border: 1px solid var(--red);
      border-radius: var(--radius);
      padding: 14px;
      color: var(--red);
      font-size: 0.85rem;
      line-height: 1.6;
    }

    /* ── Copy button ─────────────────────────────────────────── */
    .copy-btn {
      background: var(--btn-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 5px 12px;
      color: var(--text-dim);
      font-size: 0.75rem;
      cursor: pointer;
      float: right;
      margin-bottom: 8px;
    }

    .copy-btn:hover { border-color: var(--accent); color: var(--accent); }
  </style>
</head>
<body>

<!-- ── Header ─────────────────────────────────────────────── -->
<header>
  <div class="logo">C</div>
  <h1>C Assistant</h1>
  <p>Powered by Groq &bull; llama-3.3-70b-versatile</p>
</header>

<!-- ── API Key bar ────────────────────────────────────────── -->
<div class="key-bar">
  <label>Groq API Key:</label>
  <input type="password" id="apiKey" placeholder="gsk_..." autocomplete="off" />
  <span class="key-status bad" id="keyStatus">No key</span>
</div>

<!-- ── Main ──────────────────────────────────────────────── -->
<main>

  <!-- Input panel -->
  <div class="panel">
    <div class="panel-header">Your Code / Question</div>
    <textarea id="inputArea"
      placeholder="Paste your C code or describe a problem here...&#10;&#10;Examples:&#10;- Paste broken code and click Fix&#10;- Describe a problem and click Solution&#10;- Paste working code and click Explain"></textarea>
    <div class="btn-row">
      <button class="btn" onclick="ask('explain')">&#129504; Explain</button>
      <button class="btn" onclick="ask('hint')">&#128161; Hint</button>
      <button class="btn" onclick="ask('fix')">&#128295; Fix</button>
      <button class="btn primary" onclick="ask('solution')">&#128187; Solution</button>
      <button class="btn" onclick="clearAll()" style="flex:0;min-width:40px;color:var(--red)">&#10005;</button>
    </div>
  </div>

  <!-- Output panel -->
  <div class="panel">
    <div class="panel-header">
      Response
      <button class="copy-btn" id="copyBtn" onclick="copyResponse()" style="display:none">Copy</button>
    </div>
    <div class="output-area" id="outputArea">
      <div class="placeholder-msg">
        <div class="big">&#128187;</div>
        Paste your C code or question on the left,<br>
        then choose a mode below.
      </div>
    </div>
  </div>

</main>

<script>
// ── System prompts ────────────────────────────────────────
const PROMPTS = {
  explain:
    "You are a professional C programming expert explaining to a beginner. " +
    "Follow this structure: (1) Restate what the code does in one sentence. " +
    "(2) Name the algorithm or pattern used. " +
    "(3) Explain with a real-world analogy. " +
    "(4) Mention relevant C details (pointers, malloc, stack/heap). " +
    "(5) State time and space complexity. No code in response.",

  hint:
    "You are a C programming mentor. Give ONE focused hint only. " +
    "Identify the right algorithm and WHY it beats simpler alternatives. " +
    "Give one concrete directional nudge. Never write code. Never reveal the answer.",

  fix:
    "You are a C code debugger. " +
    "Find every bug (logic errors, memory leaks, undefined behaviour, off-by-one). " +
    "Return the COMPLETE corrected C code — no placeholders, no ellipsis. " +
    "Then add 'Bugs fixed:' listing each change and why. " +
    "Code must compile cleanly under gcc -Wall -Wextra.",

  solution:
    "You are an expert-level C programming and competitive programming assistant. " +
    "Before writing any code, follow these steps STRICTLY: " +
    "(1) APPROACHES: List ALL possible approaches with time and space complexity for each. " +
    "(2) REJECTION: Explicitly reject every non-optimal approach with a one-line reason. " +
    "(3) BEST APPROACH: State the chosen approach and justify it in one line. " +
    "(4) IMPLEMENTATION: Write clean, production-level C code — no pseudo-code, correct memory management, " +
        "NULL-check every malloc, guard every function entry against NULL inputs, " +
        "free() ALL memory on EVERY return path including early returns and error paths. " +
    "(5) DRY RUN: Trace the example step by step. Label as 'Expected output (simulated)'. " +
    "(6) EDGE CASES: List 3 tricky inputs and expected outputs. " +
    "Complexity rules: Prefer O(n) over O(n^2). Prefer O(1) space over O(n) when feasible. " +
    "If an optimal O(n) solution exists, do NOT implement O(n^2). " +
    "Data structure rules: " +
    "HASH MAP: Never index array by key unless key range is bounded. For LRU Cache use table size MAX_KEY+1 (10001). " +
    "Track size separately from capacity. After eviction set hashTable[evicted->key]=NULL. " +
    "PRIORITY QUEUE: Never use sorted linked list. Always use binary min-heap with bubbleUp/bubbleDown O(log n). " +
    "GRAPH: Prefer adjacency list O(V+E) over adjacency matrix O(V^2) for sparse graphs. " +
    "DIJKSTRA: Include visited[] or stale-entry check. Store (cost,node) pairs in heap. " +
    "CONSTRAINED DIJKSTRA: Use 2D state dist[node][stops]. Single dist[] is WRONG with stop constraints. " +
    "NEVER claim tests passed unless actually executed."
};

// ── API key handling ───────────────────────────────────────
const keyInput    = document.getElementById('apiKey');
const keyStatus   = document.getElementById('keyStatus');
let lastResponse  = '';

// Load saved key
const saved = localStorage.getItem('groq_api_key');
if (saved) { keyInput.value = saved; setKeyStatus(true); }

keyInput.addEventListener('input', () => {
  const k = keyInput.value.trim();
  localStorage.setItem('groq_api_key', k);
  setKeyStatus(k.startsWith('gsk_') && k.length > 20);
});

function setKeyStatus(ok) {
  keyStatus.textContent = ok ? 'Key saved' : 'No key';
  keyStatus.className   = 'key-status ' + (ok ? 'ok' : 'bad');
}

// ── Groq API call ──────────────────────────────────────────
async function callGroq(systemPrompt, userMsg, apiKey) {
  const resp = await fetch('https://api.groq.com/openai/v1/chat/completions', {
    method: 'POST',
    headers: {
      'Authorization':  'Bearer ' + apiKey,
      'Content-Type':   'application/json',
    },
    body: JSON.stringify({
      model: 'llama-3.3-70b-versatile',
      messages: [
        { role: 'system', content: systemPrompt },
        { role: 'user',   content: userMsg      },
      ],
      temperature: 0.3,
    }),
  });

  const data = await resp.json();
  if (!resp.ok) throw new Error(data.error?.message || 'API error ' + resp.status);
  return data.choices[0].message.content;
}

// ── Main ask function ──────────────────────────────────────
const BADGE = {
  explain:  ['badge-explain',  '&#129504; Explain'],
  hint:     ['badge-hint',     '&#128161; Hint'],
  fix:      ['badge-fix',      '&#128295; Fix'],
  solution: ['badge-solution', '&#128187; Solution'],
};

async function ask(mode) {
  const apiKey = keyInput.value.trim();
  if (!apiKey) {
    showError('Paste your Groq API key at the top first.\nGet a free key at https://console.groq.com/keys');
    return;
  }

  const query = document.getElementById('inputArea').value.trim();
  if (!query) {
    showError('Type or paste your code / question on the left first.');
    return;
  }

  // Disable buttons
  document.querySelectorAll('.btn').forEach(b => b.disabled = true);
  document.getElementById('copyBtn').style.display = 'none';

  // Show spinner
  const out = document.getElementById('outputArea');
  out.innerHTML = `<div class="thinking"><div class="spinner"></div> Thinking…</div>`;

  try {
    const response = await callGroq(PROMPTS[mode], query, apiKey);
    lastResponse   = response;

    const [badgeClass, badgeLabel] = BADGE[mode];
    out.innerHTML  =
      `<span class="mode-badge ${badgeClass}">${badgeLabel}</span>` +
      `<div class="md-output">${marked.parse(response)}</div>`;

    // Syntax highlight code blocks
    out.querySelectorAll('pre code').forEach(el => hljs.highlightElement(el));
    document.getElementById('copyBtn').style.display = 'inline';

  } catch (err) {
    showError(err.message);
  }

  document.querySelectorAll('.btn').forEach(b => b.disabled = false);
}

function showError(msg) {
  document.getElementById('outputArea').innerHTML =
    `<div class="error-box">&#9888; ${msg.replace(/\n/g,'<br>')}</div>`;
}

function clearAll() {
  document.getElementById('inputArea').value = '';
  document.getElementById('outputArea').innerHTML =
    `<div class="placeholder-msg"><div class="big">&#128187;</div>Ready.</div>`;
  document.getElementById('copyBtn').style.display = 'none';
  lastResponse = '';
}

function copyResponse() {
  navigator.clipboard.writeText(lastResponse).then(() => {
    const btn = document.getElementById('copyBtn');
    btn.textContent = 'Copied!';
    setTimeout(() => btn.textContent = 'Copy', 1500);
  });
}

// Configure marked
marked.setOptions({ breaks: true, gfm: true });
</script>
</body>
</html>
